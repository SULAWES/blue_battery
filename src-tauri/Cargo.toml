[package]
name = "blue-battery"
version = "0.1.0"
description = "A lightweight Bluetooth battery tray panel for Windows."
authors = ["SULAW"]
edition = "2024"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1.0"
resvg = { version = "0.47", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = ["tray-icon"] }
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Storage_Streams",
] }
