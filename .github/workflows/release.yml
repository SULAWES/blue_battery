name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Show Rust toolchain
        run: rustup show

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }
          "BLUE_BATTERY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLUE_BATTERY_ZIP=release/BlueBattery-demo-v$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run panel and metadata tests
        run: npm run test:panel

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable demo package
        run: npm run demo:package

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = $env:BLUE_BATTERY_VERSION
          $changelog = Get-Content -Path CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+$([regex]::Escape($version))\s*\r?\n(?<body>.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $version."
          }
          $notes = $match.Groups["body"].Value.Trim()
          if (-not $notes) {
            throw "Release notes for $version are empty."
          }
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      - name: Upload demo package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueBattery-demo
          path: release/BlueBattery-demo-v*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:BLUE_BATTERY_ZIP --title "Blue Battery $env:BLUE_BATTERY_VERSION" --notes-file release-notes.md --verify-tag
